
[workspace]
resolver = "2"
members = [
    "core",
    "providers/completions",
    "providers/gemini",
    "providers/claude",
    "providers/openai",
    "providers/ollama",
    "providers/huggingface",
    "providers/cerebras",
    "providers/router",
]

[workspace.package]
authors      = ["Chat-rs Team"]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/EggerMarc/chat-rs"
rust-version = "1.94" 

[workspace.dependencies]
async-stream        = "0.3.6"
async-trait         = "0.1.89"
chrono              = "0.4.41"
futures             = "0.3.32"
infer               = "0.19.0"
inventory           = "0.3.20"
reqwest             = "0.13.2"
schemars            = "1.1.0"
serde               = { version = "1.0.228", features = ["derive"] }
serde_json          = "1.0.145"
thiserror           = "2.0.17"
tokio               = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tools-rs            = "0.3.3"
tools_core          = "0.3.3"
tools_macros        = "0.3.0"
tungstenite         = { version = "0.29", features = ["native-tls"] }
tokio-tungstenite   = { version = "0.28", features = ["native-tls"] }
url                 = { version = "2.5.8", features = ["serde"] }

[package]
name         = "chat-rs"
version      = "0.1.2"
description  = "Build LLM clients with ease, attach them to your tools"
autoexamples = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "chat_rs"
path = "src/lib.rs"

[dependencies]
chat-core        = { path = "core", version = "0.1.2" }
chat-completions = { path = "providers/completions", version = "0.1.0", optional = true }
chat-gemini      = { path = "providers/gemini", version = "0.1.2", optional = true }
chat-openai      = { path = "providers/openai", version = "0.1.2", optional = true }
chat-claude      = { path = "providers/claude", version = "0.1.2", optional = true }
chat-ollama      = { path = "providers/ollama", version = "0.1.0", optional = true }
chat-huggingface = { path = "providers/huggingface", version = "0.1.0", optional = true }
chat-cerebras    = { path = "providers/cerebras", version = "0.1.0", optional = true }
chat-router      = { path = "providers/router", version = "0.1.1", optional = true }
tokio.workspace = true
schemars.workspace = true
serde.workspace = true
inventory.workspace = true
tools-rs.workspace = true
tools_macros.workspace = true
tools_core.workspace = true
serde_json.workspace = true
url.workspace = true



[dev-dependencies]
dotenvy      = "0.15"
regex        = "1"
once_cell    = "1"
serde.workspace = true
serde_json.workspace = true
inventory.workspace    = true
tools-rs.workspace = true
tools_core.workspace = true
tools_macros.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

[features]
default = []
completions = ["dep:chat-completions"]
gemini = ["dep:chat-gemini"]
claude = ["dep:chat-claude"]
openai = ["dep:chat-openai"]
ollama = ["dep:chat-ollama", "dep:chat-completions"]
huggingface = ["dep:chat-huggingface", "dep:chat-completions"]
cerebras = ["dep:chat-cerebras", "dep:chat-completions"]
router = ["dep:chat-router"]
python = ["tools-rs/python"]
stream = ["chat-core/stream", "chat-completions?/stream", "chat-gemini?/stream", "chat-openai?/stream", "chat-claude?/stream", "chat-ollama?/stream", "chat-huggingface?/stream", "chat-cerebras?/stream", "chat-router?/stream"]
tungstenite = ["chat-core/tungstenite"]
tokio-tungstenite = ["chat-core/tokio-tungstenite"]


