[package]
name = "chat-ollama"
version = "0.2.4"
description = "Ollama provider for chat-rs (OpenAI-compatible endpoint)."
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies]
chat-completions = { path = "../completions", version = "0.2.4" }

serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
chat-core = { path = "../../core", version = "0.4.0", features = ["reqwest-transport"] }
tokio.workspace = true

[features]
default = []
stream = ["chat-completions/stream"]
