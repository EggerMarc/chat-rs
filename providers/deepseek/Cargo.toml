[package]
name = "chat-deepseek"
version = "0.1.3"
description = "DeepSeek provider for chat-rs."
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies]
chat-completions = { path = "../completions", version = "0.2.4" }

[dev-dependencies]
chat-core = { path = "../../core", version = "0.4.0", features = ["reqwest-transport"] }
tokio.workspace = true

[features]
default = []
stream = ["chat-completions/stream"]
