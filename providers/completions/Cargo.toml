[package]
name = "chat-completions"
version = "0.2.2"
description = "Generic OpenAI-compatible Chat Completions client for chat-rs. Bring your own server (Ollama, vLLM, llama.cpp, LiteLLM, etc.)."
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies]
chat-core = { path = "../../core", version = "0.2.2", features = ["reqwest-transport"] }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tools-rs.workspace = true
futures = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
schemars.workspace = true
url.workspace = true
base64              = "0.22.1"

[dev-dependencies]
chat-core = { path = "../../core", version = "0.2.2", features = ["reqwest-transport"] }
tokio.workspace = true
serde_json.workspace = true

[features]
default = []
stream = ["chat-core/stream", "dep:async-stream", "dep:futures"]
