[package]
name = "chat-responses"
version = "0.1.0"
description = "Generic OpenAI Responses API client for chat-rs. Bring your own server."
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies]
chat-core = { path = "../../core", version = "0.2.1", features = ["reqwest-transport"] }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tools-rs.workspace = true
futures = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
schemars.workspace = true
url.workspace = true
base64              = "0.22.1"

[dev-dependencies]
chat-core = { path = "../../core", version = "0.2.1", features = ["reqwest-transport", "testing"] }
tokio.workspace = true
serde_json.workspace = true

[features]
default = []
stream = ["chat-core/stream", "dep:async-stream", "dep:futures"]
