[package]
name = "chat-core"
version = "0.1.0"
description = "Core library for chat-rs"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tools-rs.workspace = true
tools_core.workspace = true
futures.workspace = true
async-stream = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "stream"], optional = true }
url.workspace = true
infer.workspace = true 

[features]
default = []
stream = ["dep:async-stream"]
reqwest-transport = ["dep:reqwest", "dep:async-stream"]
